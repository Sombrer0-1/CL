name: orion
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
# Jetson AGX Thor / JetPack 7.2 / L4T R39.2 / driver 595.78 / CUDA 13.2 / aarch64.
# Do NOT pip-install archived x86 lockfiles (cu128 5090 or cu130 5060 Ti).
# After creating the env with this Miniconda (see A27):
#   ORION_PY="$HOME/miniconda3/envs/orion/bin/python"
#   "$ORION_PY" -m pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cu132
#   "$ORION_PY" -m pip install -e ".[repro]"
#   "$ORION_PY" -m pip install 'avalanche-lib==0.6.0' --no-deps
#   "$ORION_PY" -m pip install 'wandb==0.30.0'
# Conda CLI: $HOME/miniconda3 (writable). Env: $HOME/miniconda3/envs/orion
# Archived: docs/environments/linux_rtx5090/ (cu128), docs/environments/wsl2_rtx5060ti/ (cu130)
